# fixes the answer_relevance llm judge metric that ai4rag's own
# rag_templates_optimization component always computes (confirmed via
# inspect_params.py against the real registered pipeline: "answer_relevance
# is always computed" regardless of optimization_metric), and which was
# failing on every single question of every pattern with
# 'NoneType' object has no attribute 'strip' in
# ai4rag/evaluator/llmaj_evaluator.py:_judge_row.
#
# root caused, not guessed: both foundation models
# (openai/publishers/prelude-maas/models/glm-53-flash and
# vllm-inference/Qwen3.6-35B-A3B) are reasoning models that spend their
# entire token budget on a hidden chain of thought pass before ever
# emitting the actual answer. llmaj_evaluator.py hardcodes
# max_completion_tokens=256 for its structured json_schema judge calls,
# not enough headroom for reasoning plus a real answer, so every judge
# call hits finish_reason=length with message.content=None, confirmed
# live by replaying the exact prompt ai4rag sends directly against ogx.
#
# correction, 2026-10-10: the litemaas gateway behind vllm-inference now
# reports itself as gpt-oss-120b instead of Qwen3.6-35B-A3B (see
# manifests/spear-inference/01-ogxserver.yaml's own comment), updated
# everywhere this project names its two generation models. gpt-oss-120b
# is also a reasoning-style model family, so the same hidden chain of
# thought truncation plausibly still applies, but that has not been
# independently reconfirmed live against this specific model the way the
# Qwen3.6-35B-A3B finding above was. verify live, not assumed, before
# trusting autorag's judge scores: replay a real judge prompt against
# ogx with this proxy in front of it and confirm finish_reason is no
# longer length.
#
# also confirmed live: passing chat_template_kwargs={"enable_thinking":
# false} in the request body suppresses the reasoning pass on both
# models and they then return clean, valid json content well inside 256
# tokens. ai4rag's own OGXFoundationModel.chat() has no hook to inject
# this (its params model is a strict pydantic OGXModelParameters with
# only max_completion_tokens/temperature, no passthrough field, checked
# by reading ai4rag/rag/foundation_models/ogx.py directly out of the
# odh-autorag-rhel9 image), and llmaj_evaluator.py's own kwargs are
# hardcoded, so this cannot be fixed from any pipeline parameter or ogx
# config, it is baked into the vendored image.
#
# the fix: this tiny transparent proxy sits between the
# documents-rag-optimization-pipeline run and the real ogx service.
# every request is forwarded byte for byte unchanged EXCEPT a POST
# /v1/chat/completions whose body already carries
# response_format.type == "json_schema" (i.e. only the judge's own
# structured output calls, never real generation or embedding calls,
# which do not use json_schema), which gets chat_template_kwargs
# injected before forwarding. autorag-ogx-creds' OGX_CLIENT_BASE_URL
# points here instead of straight at rag-phase1-ogx-service as of
# 2026-09-27, see scripts/06-setup-autorag-secrets.sh and
# PHASE1_PLAN.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-phase1-judge-proxy-script
  namespace: spear-inference
data:
  proxy.py: |
    # stdlib only on purpose, no pip install at pod startup to depend on,
    # see the header comment in 03-judge-proxy.yaml for the full story.
    import json
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    UPSTREAM = "http://rag-phase1-ogx-service.spear-inference.svc.cluster.local:8321"


    class ProxyHandler(BaseHTTPRequestHandler):
        def _forward(self):
            length = int(self.headers.get("Content-Length", 0))
            body = self.rfile.read(length) if length else b""

            if self.command == "POST" and self.path == "/v1/chat/completions" and body:
                try:
                    payload = json.loads(body)
                except ValueError:
                    payload = None
                if isinstance(payload, dict):
                    response_format = payload.get("response_format") or {}
                    if response_format.get("type") == "json_schema" and "chat_template_kwargs" not in payload:
                        payload["chat_template_kwargs"] = {"enable_thinking": False}
                        body = json.dumps(payload).encode()

            headers = {k: v for k, v in self.headers.items() if k.lower() not in ("host", "content-length")}
            headers["Content-Length"] = str(len(body))
            req = urllib.request.Request(UPSTREAM + self.path, data=body or None, headers=headers, method=self.command)
            try:
                with urllib.request.urlopen(req, timeout=1200) as resp:
                    self.send_response(resp.status)
                    for k, v in resp.headers.items():
                        if k.lower() not in ("transfer-encoding", "connection"):
                            self.send_header(k, v)
                    self.end_headers()
                    self.wfile.write(resp.read())
            except urllib.error.HTTPError as exc:
                self.send_response(exc.code)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(exc.read())

        def do_GET(self):
            self._forward()

        def do_POST(self):
            self._forward()

        def log_message(self, fmt, *args):
            print("%s - %s" % (self.address_string(), fmt % args))


    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", 8080), ProxyHandler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-phase1-judge-proxy
  namespace: spear-inference
  labels:
    app: rag-phase1-judge-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-phase1-judge-proxy
  template:
    metadata:
      labels:
        app: rag-phase1-judge-proxy
    spec:
      containers:
        - name: proxy
          image: registry.access.redhat.com/ubi9/python-312:latest
          command: ["python3", "/app/proxy.py"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: script
              mountPath: /app/proxy.py
              subPath: proxy.py
      volumes:
        - name: script
          configMap:
            name: rag-phase1-judge-proxy-script
---
apiVersion: v1
kind: Service
metadata:
  name: rag-phase1-judge-proxy
  namespace: spear-inference
spec:
  selector:
    app: rag-phase1-judge-proxy
  ports:
    - port: 8321
      targetPort: 8080
