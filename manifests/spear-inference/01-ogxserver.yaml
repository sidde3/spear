# single stage ogxserver cr, foundation models plus embedding model
# wired in from the start. this used to be a two stage deploy (a
# provider free "probe" cr applied first, then a second full cr
# replacing it once the api key secrets existed), consolidated into one
# file on 2026-09-28 since the two stage split was never actually
# required, it only existed because the probe cr was written before the
# real fix below was known. requires ogx-glm-key, ogx-litemaas-key and
# ogx-embedding-key to already exist before this is applied, see
# scripts/05-install-inference.sh.
#
# resolved 2026-09-25, blocker 1 (OCI label fetch 401): the operator's own
# config generation step was failing with "failed to resolve base config
# from OCI labels ... HTTP 401" fetching
# registry.redhat.io/rhoai/odh-ogx-core-rhel9, confirmed not a credentials
# problem we could fix from outside the operator (a working
# registry.redhat.io credential pulled the exact same digest fine via
# curl/oc image info/podman, was linked to the operator's own service
# account, to this namespace's default service account, and to the
# cluster's global pull secret in turn, all confirmed to propagate, none
# of it changed the operator's own 401). fix: spec.storage is left unset
# entirely below, which drives the generation step down a path that no
# longer needs that fetch to succeed.
#
# resolved 2026-09-25, blocker 2 (storage generation bug): once config
# generation started succeeding, the pod crash looped on startup with a
# pydantic validation error, "storage.backends.sql_default.sql_postgres.user
# Field required". confirmed by reading the operator generated configmap
# directly: given spec.storage.sql.connectionString, the operator emits
# `connection_string: ${env...}` for the sql_postgres backend and silently
# drops kv_default to an ephemeral kv_sqlite backend, but the actual ogx
# binary's schema for sql_postgres wants discrete host/port/db/user/password
# fields, not a connection string, a second, independent operator bug in
# this build (v0.13.0). fix: skip the typed spec.storage generation path
# entirely and set the same env vars the image's own baked in config.yaml
# already expects directly on the pod via spec.workload.overrides.env, so
# ogx's own startup time substitution fills in the discrete fields itself.
#
# resolved 2026-09-25, blocker 3, the real one, after chasing spec.providers,
# spec.baseConfig, and spec.overrideConfig in turn (all three genuinely
# looked like they should work, the crd's own webhook and oc explain docs
# describe them as doing exactly what we needed): none of them ever reach
# the running pod at all, on this operator build (v0.13.0). proven three
# ways: (a) the pod's /opt/app-root/config.yaml has the exact byte size
# and mtime of the operator's own pinned base image layer, unchanged by
# any cr spec edit or pod restart; (b) the ogx server's own service
# account has no rbac at all to get configmaps or ogxservers, `oc auth
# can-i get configmaps --as=...` says no, so the running process could
# not fetch either even if it wanted to; (c) the "generated configmap"
# the operator does produce on every cr spec change is a write only side
# effect, nothing ever reads it back into the pod. config.yaml is a
# static file baked into the image, full stop, and every one of
# spec.providers/spec.baseConfig/spec.overrideConfig is inert on this
# build. the only thing that genuinely reaches the pod is
# spec.workload.overrides.env below.
#
# the actual fix: the baked in config.yaml already carries generic, env
# var activated inference provider slots meant for exactly this kind of
# "point me at an openai compatible endpoint" case:
#   remote::openai        activated by OPENAI_API_KEY,      OPENAI_BASE_URL
#   remote::vllm inference activated by VLLM_URL,            VLLM_API_TOKEN
#   remote::vllm embedding activated by VLLM_EMBEDDING_URL,  VLLM_EMBEDDING_API_TOKEN
# only one instance of each slot exists in the image, so this build
# tops out at exactly three externally wired providers, which happens to
# match what this project needs (two chat models, one embedding model).
#
# provider details, confirmed live 2026-09-27:
#   remote::openai        -> maas gateway, glm-53-flash (body based
#     routing, not the old per model path, see PHASE1_PLAN.md)
#   remote::vllm inference -> litemaas gateway, reports itself as
#     Qwen3.6-35B-A3B under /v1/models. correction, 2026-10-10: the same
#     gateway, same ogx-litemaas-key, now reports itself as gpt-oss-120b
#     instead, confirmed live against ogx's own /v1/models, an upstream
#     change on litemaas's own side, nothing in this cr changed. every
#     other model slot was unaffected. see pipelines/phase1_autorag/
#     run_autorag.py's own GENERATION_MODELS, now updated to match
#   remote::vllm embedding -> a self hosted text-embeddings-inference
#     (TEI) server inside this namespace (manifests/spear-inference/02-embed-server.yaml),
#     serving nomic-embed-text-v1.5 natively at 768 dims with a genuine
#     8192 token context. litemaas's own Nomic-embed-text-v2-moe was
#     tried first and ruled out (hard capped at 512 tokens server side,
#     below the 700 token minimum autorag's search space validation
#     requires), Gemini's embeddings endpoint was tried next and also
#     ruled out (no usage field, crashes ogx's openai_mixin.py, and a
#     3072 dim output that does not match this project's pgvector
#     schema), see PHASE1_PLAN.md for both.
#
# NAMESPACE_MIGRATION_PLAN.md: this cr's own namespace changed from
# rag-phase1 to spear-inference, pgvector moved out to its own
# spear-data namespace alongside it, so the metadata store and
# vector_io env vars below now point cross namespace, and a new
# ingress rule for spear-data was added below so spear-data's own
# rag-query-relay can still reach the embeddings endpoint, re verify
# live, not assumed, once this is actually applied
apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: rag-phase1-ogx
  namespace: spear-inference
spec:
  # rh-dev is deprecated in the operator version installed on this cluster
  # (v0.13.0), confirmed live 2026-09-25 via an admission warning on apply,
  # rh is its replacement.
  distribution:
    name: rh
  # declared here, not an imperative oc patch from a script: this file
  # is already the one place that owns this cr, no reason to split its
  # own network policy out into a separate shell step. confirmed live
  # 2026-10-03 this field replaces the operator's own default ingress
  # rules rather than merging with them, despite the field's own stated
  # description saying merged, so every rule actually needed is listed
  # explicitly: same namespace plus redhat-ods-applications on 8321 and
  # monitoring on 9464 are the operator's own defaults, spear-shield-agents
  # and spear-data are this project's own additions, spear-coordinator-agent's
  # and spear-retrieval-agent's own calls through spear-guardrails, and
  # spear-data's own rag-query-relay calling the embeddings endpoint
  # directly now that pgvector and ogx no longer share a namespace
  network:
    policy:
      enabled: true
      ingress:
        - from:
            - podSelector: {}
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: redhat-ods-applications
          ports:
            - protocol: TCP
              port: 8321
        - from:
            - namespaceSelector:
                matchLabels:
                  network.openshift.io/policy-group: monitoring
          ports:
            - protocol: TCP
              port: 9464
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: spear-shield-agents
          ports:
            - protocol: TCP
              port: 8321
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: spear-data
          ports:
            - protocol: TCP
              port: 8321
        # correction, 2026-10-04: missed when this cr's own namespace split
        # off from the pipeline server's, the ingestion pipeline's own
        # generate_eval_dataset step (pipelines/phase1_ingestion/pipeline.py)
        # calls this service directly from spear-pipelines and got a
        # silent, dropped connection, not a fast refusal, confirmed live:
        # a plain curl from spear-pipelines timed out completely while the
        # identical call from spear-inference itself or via a port forward
        # (which bypasses NetworkPolicy) succeeded instantly. that dropped
        # tcp handshake is exactly what produced the ~120s retry cadence
        # litellm's own sdg hub call kept logging, not a model id problem,
        # confirmed separately by both the single and double "openai/"
        # prefixed model id forms routing and responding correctly and
        # quickly once connectivity actually exists
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: spear-pipelines
          ports:
            - protocol: TCP
              port: 8321
        # same gap, a different caller: nemoguardrails itself (the
        # coordinator-agent-config and work-tracker-config models: blocks)
        # calls this service directly from spear-guardrails for its own
        # generation step, confirmed live via the pod's own traceback,
        # nemoguardrails.exceptions.LLMTimeoutError wrapping a real
        # httpcore.ConnectTimeout against rag-phase1-ogx-service, caught
        # by nemoguardrails's own generic exception handler and returned
        # as a clean 200 with message.content literally "Internal server
        # error", no tool_calls, which is what owner-console's chat page
        # ends up showing the real human. a plain curl from spear-guardrails
        # reproduced the same silent timeout the spear-pipelines gap above
        # did, this namespace was simply never added either.
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: spear-guardrails
          ports:
            - protocol: TCP
              port: 8321
        # evalhub's own eval job pods call this raw server directly as
        # their judge/embedding model, bypassing guardrails since this is
        # an internal evaluation call not live user traffic. confirmed
        # live the same way as the gaps above: the sidecar proxy's own
        # chat completions call hung until deadline exceeded with no
        # entry here, scripts/10-install-evalhub.sh
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: spear-shield-eval
          ports:
            - protocol: TCP
              port: 8321
  workload:
    overrides:
      env:
        # ogx's own metadata store (kv_default/sql_default in the base
        # config), a separate database on spear-data's own pgvector
        # instance, created once by scripts/05-install-inference.sh
        # (ensure_ogx_metadata_db).
        - name: POSTGRES_HOST
          value: pgvector.spear-data.svc.cluster.local
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: ogx_metadata
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: pgvector-creds
              key: user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pgvector-creds
              key: password
        # vector_io provider, the rag corpus's own vector store, ragdb on
        # spear-data's own pgvector instance. ENABLE_PGVECTOR must be set
        # (any non empty value) for the base config's
        # ${env.ENABLE_PGVECTOR:+pgvector} provider_id conditional to
        # activate this provider at all.
        - name: ENABLE_PGVECTOR
          value: "true"
        - name: PGVECTOR_HOST
          value: pgvector.spear-data.svc.cluster.local
        - name: PGVECTOR_PORT
          value: "5432"
        - name: PGVECTOR_DB
          value: ragdb
        - name: PGVECTOR_USER
          valueFrom:
            secretKeyRef:
              name: pgvector-creds
              key: user
        - name: PGVECTOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pgvector-creds
              key: password
        # remote::openai slot, glm-53-flash via the maas gateway. the
        # root, body based routing endpoint, not a per model path (that
        # one genuinely 404s, confirmed by calling it directly, bypassing
        # ogx entirely, see PHASE1_PLAN.md). the root endpoint's own
        # /v1/models lists this model's real id as
        # `publishers/prelude-maas/models/glm-53-flash`, ogx discovers
        # provider models dynamically (there is no static
        # provider_model_id override for this slot the way the
        # embedding slot has one), so it ends up exposed under
        # /v1/models as `openai/publishers/prelude-maas/models/glm-53-flash`
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ogx-glm-key
              key: apiKey
        - name: OPENAI_BASE_URL
          value: https://maas.apps.ocp.cloud.rhai-tmm.dev/v1
        # remote::vllm slot, the litemaas gateway, chat model
        - name: VLLM_URL
          value: https://litemaas.rhoai.rh-aiservices-bu.com/v1
        - name: VLLM_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: ogx-litemaas-key
              key: apiKey
        # second remote::vllm slot in the image's static config,
        # dedicated to embeddings, pointed at the self hosted TEI
        # server (manifests/spear-inference/02-embed-server.yaml)
        - name: VLLM_EMBEDDING_URL
          value: http://rag-phase1-embed-server.spear-inference.svc.cluster.local/v1
        # tei has no auth of its own, this is a placeholder so the
        # required env var is non empty, the value is never checked
        - name: VLLM_EMBEDDING_API_TOKEN
          value: not-required-auth-disabled-on-tei
        - name: EMBEDDING_MODEL
          value: nomic-embed-text-v1.5
        - name: EMBEDDING_PROVIDER_MODEL_ID
          value: nomic-embed-text-v1.5
        # confirmed live 2026-09-27 via a real /v1/embeddings call
        # straight against the tei server, len(data[0].embedding) == 768
        - name: EMBEDDING_DIMENSION
          value: "768"
