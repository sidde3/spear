# the spear-shield-agents realm, entirely new, nothing shared with
# agent-pack-realm or sso. same shared keycloak server (keycloakCRName:
# keycloak), same import object pattern those two already use.
#
# tool:search_work_packages and tool:update_work_package are the real,
# decided names, not placeholders, see PHASE2_PLAN.md section 4. the
# scope mapping is on spear-coordinator because that is the client
# owner-console-backend uses for the password grant per real human user,
# section 8, so the resulting token actually carries resource_access for
# whichever tool roles that specific user holds, not a fixed agent identity.
#
# balakrishnan.b and siddhartha.de attributes are copied straight from the
# real rag_chunks rows they are meant to match, not invented, section 6.
#
# two things this file alone does not reproduce, found empirically once
# applied, not assumed: keycloak's declarative user profile silently drops
# any custom user attribute (clearance_level/dept/team) unless the realm
# explicitly turns on unmanagedAttributePolicy, and custom attributes never
# reach a token's claims without an explicit protocol mapper per client.
# both are handled below, in the realm's own attributes block and on
# spear-coordinator's protocolMappers. note also that KeycloakRealmImport is
# a one time import job, editing this file after the first successful apply
# does not re run it, use the admin api directly against an already
# imported realm, same as this realm was fixed up after the fact.
#
# a third thing this file does not, and cannot, reproduce: the "spire"
# spiffe identity provider (trustDomain spiffe://agent-pack.internal,
# bundleEndpoint the cluster's shared spire oidc discovery route,
# supportsClientAssertions true) and the custom "clients-federated"
# authentication flow (a copy of the realm's builtin "clients" flow with
# federated-jwt wired in, bound as the realm's clientAuthenticationFlow).
# neither an identity provider nor an authentication flow is representable
# in a KeycloakRealmImport spec at all, mirroring the reference's own
# sync_spiffe_federated_auth and enable_federated_jwt_client_auth functions
# exactly, section 2. without both, spear-coordinator-workload's
# federated-jwt token_grant calls 400 with client_not_found with no idp at
# all, or 401 invalid_client with the idp but no auth flow bound, confirmed
# by the reference's own hard won comment on the first failure mode and by
# this project's own live rebuild on the second, not rediscovered from
# scratch either time. no longer a one off live admin api action with
# nothing to show for it on a rebuild: scripts/09-install-worktracker-and-agents.sh's
# own ensure_spiffe_federated_auth runs this exact admin api sequence every
# install, idempotent, called right after this file is applied
#
# a fourth thing this file does not reproduce, same live-admin-api-only
# shape as the two above: balakrishnan.b and siddhartha.de also need real
# accounts in the separate, pre existing "sso" realm (oauth cluster's own
# identity provider, not owned by this project), that is the realm a
# human actually logs into the openshift console with, see
# PHASE2_PLAN.md section 8. a KeycloakRealmImport cannot add users to a
# realm it does not own, so those two accounts were created live against
# the admin api, same password value as below, kept identical on purpose
# so one password per persona works at both layers. lost on the
# 2026-10-04 rebuild, same as the spiffe idp/auth flow above, recreated
# live, not captured here
#
# a fifth thing, not live admin api only this time, a genuine manifest
# bug the 2026-10-04 restructuring pass introduced: the bearer only
# resource client and the tool roles below used to read
# spear-shield-agents/spear-openproject-mcp, because that used to be
# the real mcp server's own namespace. the restructuring moved the
# actual MCPServer cr to spear-worktracker (manifests/spear-worktracker/04-openproject-mcp.yaml)
# without updating this file to match, so every minted token's
# resource_access claim carried a key the live system never checks
# against. confirmed via mcp-gateway's own broker log line, "upstream
# mcp server"=spear-worktracker/spear-openproject-mcp:..., that string
# before the first colon is exactly what 03-auth-policies.yaml's own
# tool rbac predicate reads as request.headers['x-mcp-servername'], and
# confirmed live this mismatch made every tool call 403 with "forbidden:
# insufficient permissions for this tool" regardless of which roles a
# user actually held, since resource_access never had an entry under
# the real key at all. renamed below to the real, current namespace,
# re applied live against the bearer only client's own clientId field
# since KeycloakRealmImport is one time, same shape as every other live
# admin api fix already documented above
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: spear-shield-agents-realm
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: spear-shield-agents
spec:
  keycloakCRName: keycloak
  realm:
    realm: spear-shield-agents
    enabled: true
    sslRequired: external
    registrationAllowed: false
    loginWithEmailAllowed: false
    duplicateEmailsAllowed: false
    resetPasswordAllowed: false
    editUsernameAllowed: false
    attributes:
      userProfileConfig: '{"attributes":[{"name":"username","permissions":{"view":["admin","user"],"edit":["admin","user"]}},{"name":"email","required":{"roles":["user"]},"permissions":{"view":["admin","user"],"edit":["admin","user"]}},{"name":"firstName","required":{"roles":["user"]},"permissions":{"view":["admin","user"],"edit":["admin","user"]}},{"name":"lastName","required":{"roles":["user"]},"permissions":{"view":["admin","user"],"edit":["admin","user"]}}],"unmanagedAttributePolicy":"ENABLED"}'
    roles:
      client:
        spear-worktracker/spear-openproject-mcp:
          - name: tool:search_work_packages
          - name: tool:update_work_package
    clientScopeMappings:
      spear-worktracker/spear-openproject-mcp:
        - client: spear-coordinator
          roles:
            - tool:search_work_packages
            - tool:update_work_package
    clients:
      - clientId: spear-coordinator
        name: spear-coordinator
        enabled: true
        protocol: openid-connect
        publicClient: false
        secret: f505e68dafacd8e440db4fef433366974f49079da21d8f28
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        directAccessGrantsEnabled: true
        clientAuthenticatorType: client-secret
        # without these, clearance_level/dept/team never reach the token this
        # client mints, and section 3's abac filter has nothing to read
        protocolMappers:
          - name: clearance_level
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            config:
              user.attribute: clearance_level
              claim.name: clearance_level
              jsonType.label: String
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
              multivalued: "false"
              aggregate.attrs: "false"
          - name: dept
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            config:
              user.attribute: dept
              claim.name: dept
              jsonType.label: String
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
              multivalued: "false"
              aggregate.attrs: "false"
          - name: team
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            config:
              user.attribute: team
              claim.name: team
              jsonType.label: String
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
              multivalued: "false"
              aggregate.attrs: "false"
      # federated-jwt client for openshell token_grant, a2a egress. sub must
      # match the coordinator sandbox's own spiffe id once it is deployed.
      #
      # trust domain corrected after live verification: PHASE2_PLAN.md
      # originally called for this project's own trust domain,
      # spiffe://spear-shield.internal, but the real ZeroTrustWorkloadIdentityManager
      # cr on this cluster is a single cluster wide singleton the
      # reference project already created, trustDomain: agent-pack.internal,
      # immutable once set, confirmed live. spire issues every svid on
      # this cluster under that one trust domain regardless of which
      # project's workload it is, changing it would break agent-pack's
      # own already-issued identities, against this project's hard rule
      # of never touching agent-pack. real isolation here still comes
      # from the namespace/sandbox-name path segment, ns/spear-shield-agents/
      # sandbox/spear-coordinator-agent, which spire's own k8s workload
      # attestation (namespace + service account + pod label) actually
      # enforces, not from the trust domain string itself
      - clientId: spear-coordinator-workload
        name: spear-coordinator-workload
        enabled: true
        protocol: openid-connect
        publicClient: false
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        clientAuthenticatorType: federated-jwt
        attributes:
          jwt.credential.issuer: spire
          # the live, observed agents.x-k8s.io/sandbox-name-hash label
          # value for sandbox name "spear-coordinator", not the sandbox
          # name itself: confirmed live that openshell sandbox create's
          # own --label app=... flag never becomes a real kubernetes pod
          # label at all, see manifests/spear-shield-agents/06-cluster-spiffeid.yaml's
          # own comment for the full story, this hash is what the
          # ClusterSPIFFEID's own podSelector and spiffeIDTemplate
          # actually key on
          jwt.credential.sub: spiffe://agent-pack.internal/ns/spear-shield-agents/sandbox/abf32a96
      - clientId: spear-retrieval
        name: spear-retrieval
        enabled: true
        protocol: openid-connect
        publicClient: false
        secret: 29fc42bb9022bb2aeda49dd63149efd54d4852c63c002c43
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        clientAuthenticatorType: client-secret
      # role namespace only, id must match the broker's x-mcp-servername
      # value, which is the real MCPServer cr's own namespace/name, not
      # wherever this project's own agents happen to live
      - clientId: spear-worktracker/spear-openproject-mcp
        name: spear-openproject-mcp tool roles
        enabled: true
        bearerOnly: true
        publicClient: false
        serviceAccountsEnabled: false
        protocol: openid-connect
      # dedicated to openshift cluster login itself, confirmed missing
      # entirely on a fresh cluster: oauth cluster's own spec starts as
      # {}, no identity providers at all, so there is no way to log into
      # the openshift web console as balakrishnan.b or siddhartha.de,
      # only kube:admin, which the console backend's own persona mapping
      # (server.py's persona_password) has no file for and predictably
      # fails on. not reusing spear-coordinator for this: that client's
      # directAccessGrantsEnabled is for the backend's own server side
      # password grant per real human user, standardFlowEnabled false,
      # the opposite of what an interactive browser redirect login
      # needs. this entry documents the client for a fresh install;
      # since KeycloakRealmImport only ever runs once (see this file's
      # own header comment), an already imported realm needs this client
      # created via the admin api instead, see
      # scripts/08-install-console.sh's own ensure_openshift_oauth_idp,
      # which also patches oauth cluster itself, not reproducible here,
      # a KeycloakRealmImport has no way to touch a cluster scoped
      # config.openshift.io object
      - clientId: openshift-console
        name: OpenShift console login
        enabled: true
        protocol: openid-connect
        publicClient: false
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        clientAuthenticatorType: client-secret
        # illustrative only, keycloak's own redirect uri matching has no
        # real glob for a variable hostname segment like this, a literal
        # fresh install needs the real cluster domain substituted here
        # (oc get ingresses.config.openshift.io cluster, same lookup
        # ensure_openshift_oauth_idp itself does) before this would ever
        # actually match a real callback, which is exactly why the live
        # fix goes through the admin api with the real domain resolved,
        # not through re-applying this file
        redirectUris:
          # ingresses.config.openshift.io cluster's own .spec.domain
          # already includes the apps. prefix, confirmed live
          # ("apps.cluster-....com"), no second apps. here
          - "https://oauth-openshift.CLUSTER_DOMAIN_PLACEHOLDER/oauth2callback/spear-shield-agents"
    users:
      - username: balakrishnan.b
        firstName: Balakrishnan
        lastName: B
        email: balakrishnan.b@spear-shield.demo
        emailVerified: true
        enabled: true
        attributes:
          clearance_level:
            - general
          dept:
            - engineering
          team:
            - data-eng
        credentials:
          - type: password
            value: ConsoleTest#2026
            temporary: false
        clientRoles:
          spear-worktracker/spear-openproject-mcp:
            - tool:search_work_packages
      - username: siddhartha.de
        firstName: Siddhartha
        lastName: De
        email: siddhartha.de@spear-shield.demo
        emailVerified: true
        enabled: true
        attributes:
          clearance_level:
            - restricted
          dept:
            - data-governance
        credentials:
          - type: password
            value: ConsoleTest#2026
            temporary: false
        clientRoles:
          spear-worktracker/spear-openproject-mcp:
            - tool:search_work_packages
            - tool:update_work_package
