# PIPELINE DEFINITION
# Name: phase1-apply-pattern-pipeline
# Description: winning autorag pattern -> re chunk + re embed the sanitized batch -> pgvector -> mlflow report
# Inputs:
#    apply_experiment_name: str [Default: 'phase1-apply-pattern']
#    artifact_bucket: str [Default: 'dsp-pipeline-artifacts']
#    autorag_run_id: str
#    batch_id: str
#    chunk_overlap: int
#    chunk_size: int
#    embedding_model: str
#    ingestion_experiment_name: str [Default: 'phase1-ingestion']
#    minio_endpoint: str [Default: 'minio.minio.svc.cluster.local:9000']
#    mlflow_url: str
#    mlflow_workspace: str [Default: 'spear-pipelines']
#    ogx_base_url: str [Default: 'http://rag-phase1-ogx-service.spear-inference.svc.cluster.local:8321']
#    pattern_name: str
#    pgvector_db: str [Default: 'ragdb']
#    pgvector_host: str [Default: 'pgvector.spear-data.svc.cluster.local']
#    pgvector_port: str [Default: '5432']
#    raw_bucket: str [Default: 'rag-documents']
#    sanitized_prefix: str [Default: 'sanitized/']
components:
  comp-apply-winning-pattern:
    executorLabel: exec-apply-winning-pattern
    inputDefinitions:
      parameters:
        autorag_run_id:
          parameterType: STRING
        batch_id:
          parameterType: STRING
        bucket:
          parameterType: STRING
        chunk_overlap:
          parameterType: NUMBER_INTEGER
        chunk_size:
          parameterType: NUMBER_INTEGER
        embedding_model:
          parameterType: STRING
        ingestion_experiment_name:
          parameterType: STRING
        minio_endpoint:
          parameterType: STRING
        mlflow_url:
          parameterType: STRING
        mlflow_workspace:
          parameterType: STRING
        ogx_base_url:
          parameterType: STRING
        pattern_name:
          parameterType: STRING
        pgvector_db:
          parameterType: STRING
        pgvector_host:
          parameterType: STRING
        pgvector_port:
          parameterType: STRING
        sanitized_prefix:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        apply_report:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        chunks_created:
          parameterType: NUMBER_INTEGER
        documents_indexed:
          parameterType: NUMBER_INTEGER
        embedding_failures:
          parameterType: NUMBER_INTEGER
  comp-log-apply-report:
    executorLabel: exec-log-apply-report
    inputDefinitions:
      artifacts:
        apply_report:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        apply_experiment_name:
          parameterType: STRING
        artifact_bucket:
          parameterType: STRING
        autorag_run_id:
          parameterType: STRING
        batch_id:
          parameterType: STRING
        chunks_created:
          parameterType: NUMBER_INTEGER
        documents_indexed:
          parameterType: NUMBER_INTEGER
        embedding_failures:
          parameterType: NUMBER_INTEGER
        minio_endpoint:
          parameterType: STRING
        mlflow_url:
          parameterType: STRING
        mlflow_workspace:
          parameterType: STRING
        pattern_name:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-apply-winning-pattern:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - apply_winning_pattern
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'boto3==1.35.99'\
          \ 'psycopg2-binary==2.9.10' 'requests==2.32.3'  &&  python3 -m pip install\
          \ --quiet --no-warn-script-location 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef apply_winning_pattern(\n    minio_endpoint: str,\n    bucket:\
          \ str,\n    sanitized_prefix: str,\n    pgvector_host: str,\n    pgvector_port:\
          \ str,\n    pgvector_db: str,\n    ogx_base_url: str,\n    mlflow_url: str,\n\
          \    mlflow_workspace: str,\n    ingestion_experiment_name: str,\n    batch_id:\
          \ str,\n    pattern_name: str,\n    autorag_run_id: str,\n    embedding_model:\
          \ str,\n    chunk_size: int,\n    chunk_overlap: int,\n    apply_report:\
          \ dsl.Output[dsl.Dataset],\n) -> NamedTuple(\"Outputs\", [(\"chunks_created\"\
          , int), (\"documents_indexed\", int), (\"embedding_failures\", int)]):\n\
          \    \"\"\"fetches batch_id's own already logged ingestion_report.json from\n\
          \    mlflow (the same artifact owner-console-backend/server.py's\n    ingestion_report()\
          \ reads), pulls the abac tags and the guardrails\n    verdict per document\
          \ from it, then re indexes every document that\n    passed sanitization\
          \ using the winning pattern's real chunk_size,\n    chunk_overlap and embedding_model_id.\n\
          \    \"\"\"\n    import hashlib\n    import json\n    import os\n    import\
          \ time\n\n    import boto3\n    import psycopg2\n    import requests\n\n\
          \    headers = {\"X-MLflow-Workspace\": mlflow_workspace, \"Content-Type\"\
          : \"application/json\"}\n    token_path = \"/var/run/secrets/kubernetes.io/serviceaccount/token\"\
          \n    if os.path.exists(token_path):\n        with open(token_path) as f:\n\
          \            headers[\"Authorization\"] = f\"Bearer {f.read().strip()}\"\
          \n\n    search = requests.post(\n        f\"{mlflow_url}/api/2.0/mlflow/experiments/search\"\
          ,\n        headers=headers, json={\"max_results\": 100}, verify=False, timeout=30,\n\
          \    ).json()\n    exp = next((e for e in search.get(\"experiments\", [])\
          \ if e[\"name\"] == ingestion_experiment_name), None)\n    if exp is None:\n\
          \        raise RuntimeError(f\"no {ingestion_experiment_name!r} experiment\
          \ found, has any batch ever been ingested?\")\n\n    runs = requests.post(\n\
          \        f\"{mlflow_url}/api/2.0/mlflow/runs/search\",\n        headers=headers,\n\
          \        json={\n            \"experiment_ids\": [exp[\"experiment_id\"\
          ]],\n            \"filter\": f\"tags.mlflow.runName = '{batch_id}'\",\n\
          \            \"max_results\": 1,\n        },\n        verify=False, timeout=30,\n\
          \    ).json().get(\"runs\", [])\n    if not runs:\n        raise RuntimeError(f\"\
          no ingestion run found for batch_id {batch_id!r}, was it ever triggered?\"\
          )\n    ingestion_run_id = runs[0][\"info\"][\"run_id\"]\n\n    report_resp\
          \ = requests.get(\n        f\"{mlflow_url}/get-artifact?path=ingestion_report.json&run_uuid={ingestion_run_id}\"\
          ,\n        headers=headers, verify=False, timeout=30,\n    )\n    report_resp.raise_for_status()\n\
          \    report = report_resp.json()\n\n    docs_by_id = {d[\"doc_id\"]: d for\
          \ d in report.get(\"valid_documents\", [])}\n    sanitized_rows = [r for\
          \ r in report.get(\"guardrails\", {}).get(\"audit\", []) if r[\"verdict\"\
          ] == \"success\"]\n\n    s3 = boto3.client(\n        \"s3\",\n        endpoint_url=f\"\
          http://{minio_endpoint}\",\n        aws_access_key_id=os.environ[\"MINIO_ACCESS_KEY\"\
          ],\n        aws_secret_access_key=os.environ[\"MINIO_SECRET_KEY\"],\n  \
          \  )\n    conn = psycopg2.connect(\n        host=pgvector_host, port=pgvector_port,\
          \ dbname=pgvector_db,\n        user=os.environ[\"PGVECTOR_USER\"], password=os.environ[\"\
          PGVECTOR_PASSWORD\"],\n    )\n    conn.autocommit = True\n    cur = conn.cursor()\n\
          \    cur.execute(\n        \"\"\"\n        CREATE TABLE IF NOT EXISTS rag_chunks\
          \ (\n            id BIGSERIAL PRIMARY KEY,\n            doc_id TEXT NOT\
          \ NULL,\n            chunk_index INT NOT NULL,\n            content TEXT\
          \ NOT NULL,\n            content_sha256 TEXT NOT NULL,\n            source\
          \ TEXT,\n            clearance_level TEXT,\n            dept TEXT,\n   \
          \         team TEXT,\n            project_scope TEXT,\n            data_owner\
          \ TEXT,\n            embedding vector(768),\n            created_at TIMESTAMPTZ\
          \ NOT NULL DEFAULT now(),\n            UNIQUE (doc_id, chunk_index)\n  \
          \      )\n        \"\"\"\n    )\n    # provenance columns, added once, so\
          \ every row always shows which\n    # pattern indexed it rather than silently\
          \ overwriting that history\n    for column, coltype in (\n        (\"pattern_name\"\
          , \"TEXT\"), (\"autorag_run_id\", \"TEXT\"),\n        (\"chunk_size\", \"\
          INT\"), (\"chunk_overlap\", \"INT\"),\n    ):\n        cur.execute(f\"ALTER\
          \ TABLE rag_chunks ADD COLUMN IF NOT EXISTS {column} {coltype}\")\n\n  \
          \  # row level security, same table this function already owns the\n   \
          \ # schema of. the real abac decision used to live only in\n    # rag_query.py's\
          \ own WHERE clause, one layer, a bug there or a future\n    # code path\
          \ that forgets to call it would have seen every row. this\n    # is the\
          \ second, independent layer: rag_reader (the only role\n    # rag-query-relay\
          \ ever connects as) has no bypassrls, so a row only\n    # ever comes back\
          \ if this policy itself says so, regardless of what\n    # sql runs against\
          \ it. rag_reader is created by\n    # scripts/03-install-data.sh, not here,\
          \ a grant against a role that\n    # does not exist yet should never be\
          \ what blocks a real indexing run\n    #\n    # correction, 2026-10-11:\
          \ this used to be one cur.execute() of a\n    # dollar-quoted DO $$ ...\
          \ $$ block doing the role check in plpgsql.\n    # confirmed live, this\
          \ project's first ever real apply-pattern run:\n    # psycopg2.errors.SyntaxError:\
          \ syntax error at or near \"$\", the\n    # submitted sql's own DO $$ had\
          \ lost one of its two $ characters by\n    # the time postgres saw it. not\
          \ a bug in this file: both the locally\n    # compiled phase1-apply-pattern-pipeline.yaml\
          \ and the exact version\n    # string stored on rag-phase1-dspa's own pipeline\
          \ server (fetched\n    # live via the v2beta1 api and diffed byte for byte)\
          \ still had the\n    # correct DO $$, intact, so whatever mangles it happens\
          \ inside\n    # rhoai's own kfp v2 launcher when it reconstructs the component's\n\
          \    # python source inside the pod at runtime, not anything compiled or\n\
          \    # stored here, and not something this repo can inspect or patch, it\n\
          \    # ships inside the vendored operator image. the real fix is this:\n\
          \    # the role check moved into python, so no dollar-quoted plpgsql\n \
          \   # block is ever sent at all, sidestepping whatever that launcher bug\n\
          \    # is rather than chasing it\n    cur.execute(\"SELECT 1 FROM pg_roles\
          \ WHERE rolname = 'rag_reader'\")\n    if cur.fetchone():\n        cur.execute(\"\
          GRANT SELECT ON rag_chunks TO rag_reader\")\n\n    cur.execute(\n      \
          \  \"\"\"\n        ALTER TABLE rag_chunks ENABLE ROW LEVEL SECURITY;\n \
          \       ALTER TABLE rag_chunks FORCE ROW LEVEL SECURITY;\n\n        DROP\
          \ POLICY IF EXISTS rag_chunks_abac ON rag_chunks;\n        -- every claim-derived\
          \ value is NULLIF'd to '', not just team: an\n        -- unrecognized caller_clearance\
          \ makes allowed_clearance_levels()\n        -- return [] (rag_query.py),\
          \ and a missing caller_dept is coerced\n        -- to \"\" (caller_dept\
          \ or \"\"), so without this normalization both\n        -- current_setting()\
          \ calls would come back as the literal empty\n        -- string rather than\
          \ NULL, and would then match any row whose\n        -- own clearance_level/dept\
          \ column was also stored as \"\" rather\n        -- than NULL, fail-open\
          \ for exactly the \"forgot a claim\" case\n        -- this second, independent\
          \ layer exists to survive. NULLIF makes\n        -- an absent claim compare\
          \ against NULL instead, which is never\n        -- true, so the row is denied\
          \ rather than matched.\n        CREATE POLICY rag_chunks_abac ON rag_chunks\n\
          \            FOR SELECT\n            USING (\n                clearance_level\
          \ = ANY(string_to_array(NULLIF(current_setting('app.allowed_levels', true),\
          \ ''), ','))\n                AND (\n                    dept = NULLIF(current_setting('app.dept',\
          \ true), '')\n                    OR team = NULLIF(current_setting('app.team',\
          \ true), '')\n                    OR project_scope = 'enterprise-wide'\n\
          \                )\n            )\n        \"\"\"\n    )\n\n    def embed_chunks(texts:\
          \ list[str]) -> list[list[float]]:\n        resp = requests.post(\n    \
          \        f\"{ogx_base_url}/v1/embeddings\",\n            json={\"model\"\
          : embedding_model, \"input\": texts},\n            timeout=120,\n      \
          \  )\n        resp.raise_for_status()\n        data = resp.json()[\"data\"\
          ]\n        return [row[\"embedding\"] for row in sorted(data, key=lambda\
          \ r: r[\"index\"])]\n\n    def embed_chunks_with_retry(texts: list[str],\
          \ attempts: int = 3) -> list[list[float]]:\n        # a null embedding row\
          \ can never be found by any vector search\n        # again, ever, regardless\
          \ of who is asking, so a transient blip\n        # is worth a couple retries\
          \ rather than writing a dead row into a\n        # live rag index. this\
          \ is the real fix for the doc-001/doc-002\n        # null embedding incident,\
          \ found and repaired live on 2026-10-02:\n        # both rows turned out\
          \ to predate this pipeline entirely, from an\n        # older ingestion\
          \ path with the same swallow-and-null behavior,\n        # never caught\
          \ because nothing downstream ever read the old\n        # embedding_failures\
          \ counter\n        last_exc = None\n        for attempt in range(attempts):\n\
          \            try:\n                return embed_chunks(texts)\n        \
          \    except requests.RequestException as exc:\n                last_exc\
          \ = exc\n                if attempt < attempts - 1:\n                  \
          \  time.sleep(2 ** attempt)\n        raise last_exc\n\n    total_chunks\
          \ = 0\n    documents_indexed = 0\n    # per doc_id, not just a count: a\
          \ bare number nobody downstream reads\n    # is not a real safety net, this\
          \ list is what actually ends up in\n    # apply_report.json and is small\
          \ enough to always include in full\n    embedding_failures = []\n    for\
          \ row in sanitized_rows:\n        doc = docs_by_id.get(row[\"doc_id\"])\n\
          \        if doc is None:\n            print(f\"  {row['doc_id']}: no abac\
          \ tags found in ingestion report, skipping\")\n            continue\n  \
          \      content = s3.get_object(\n            Bucket=bucket, Key=f\"{sanitized_prefix}{row['filename']}\"\
          \n        )[\"Body\"].read().decode(\"utf-8\")\n\n        chunks = []\n\
          \        start = 0\n        while start < len(content):\n            chunks.append(content[start:start\
          \ + chunk_size])\n            start += chunk_size - chunk_overlap\n\n  \
          \      try:\n            embeddings = embed_chunks_with_retry(chunks)\n\
          \        except requests.RequestException as exc:\n            # embed before\
          \ delete: whatever rows this doc_id already has\n            # from a previous\
          \ successful run stay exactly as they are,\n            # a failed embed\
          \ here must never make a previously working\n            # doc worse off.\
          \ skip the doc entirely rather than writing a\n            # permanently\
          \ unsearchable null vector row\n            print(f\"  {doc['doc_id']}:\
          \ embedding failed after {3} attempts ({exc}), leaving existing rows untouched,\
          \ skipping\")\n            embedding_failures.append({\"doc_id\": doc[\"\
          doc_id\"], \"error\": str(exc)})\n            continue\n\n        # only\
          \ now that the new embeddings are actually in hand: chunk\n        # boundaries\
          \ move whenever chunk_size/overlap change, so any rows\n        # this doc\
          \ had under a previous pattern are stale, drop them\n        # before writing\
          \ the fresh ones rather than leaving orphaned tails\n        cur.execute(\"\
          DELETE FROM rag_chunks WHERE doc_id = %s\", (doc[\"doc_id\"],))\n\n    \
          \    for idx, chunk in enumerate(chunks):\n            vector_literal =\
          \ \"[\" + \",\".join(repr(v) for v in embeddings[idx]) + \"]\"\n       \
          \     cur.execute(\n                \"\"\"\n                INSERT INTO\
          \ rag_chunks\n                    (doc_id, chunk_index, content, content_sha256,\
          \ source,\n                     clearance_level, dept, team, project_scope,\
          \ data_owner,\n                     embedding, pattern_name, autorag_run_id,\
          \ chunk_size, chunk_overlap)\n                VALUES (%s, %s, %s, %s, %s,\
          \ %s, %s, %s, %s, %s, %s::vector, %s, %s, %s, %s)\n                \"\"\"\
          ,\n                (\n                    doc[\"doc_id\"], idx, chunk, hashlib.sha256(chunk.encode(\"\
          utf-8\")).hexdigest(),\n                    doc.get(\"source\"), doc.get(\"\
          clearance_level\"), doc.get(\"dept\"),\n                    doc.get(\"team\"\
          ), doc.get(\"project_scope\"), doc.get(\"data_owner\"), vector_literal,\n\
          \                    pattern_name, autorag_run_id, chunk_size, chunk_overlap,\n\
          \                ),\n            )\n        total_chunks += len(chunks)\n\
          \        documents_indexed += 1\n        print(f\"  {doc['doc_id']}: {len(chunks)}\
          \ chunks written, embedded with {embedding_model}\")\n\n    report_out =\
          \ {\n        \"batch_id\": batch_id,\n        \"pattern_name\": pattern_name,\n\
          \        \"autorag_run_id\": autorag_run_id,\n        \"table\": \"rag_chunks\"\
          ,\n        \"chunking_method\": \"fixed_size_window (winner's real chunk_size/overlap,\
          \ not autorag's own splitting algorithm, see this file's module docstring)\"\
          ,\n        \"chunk_size\": chunk_size,\n        \"chunk_overlap\": chunk_overlap,\n\
          \        \"embedding_model\": embedding_model,\n        # list of {doc_id,\
          \ error}, not a count: an empty list here is the\n        # only thing that\
          \ actually means every sanitized doc got indexed\n        # and is really\
          \ searchable, a doc_id in this list was left alone,\n        # not written\
          \ with a dead row\n        \"embedding_failures\": embedding_failures,\n\
          \        \"documents_indexed\": documents_indexed,\n        \"chunks_created\"\
          : total_chunks,\n    }\n    with open(apply_report.path, \"w\") as f:\n\
          \        json.dump(report_out, f, indent=2)\n\n    cur.close()\n    conn.close()\n\
          \n    outputs = NamedTuple(\"Outputs\", [(\"chunks_created\", int), (\"\
          documents_indexed\", int), (\"embedding_failures\", int)])\n    return outputs(total_chunks,\
          \ documents_indexed, len(embedding_failures))\n\n"
        image: registry.access.redhat.com/ubi9/python-311:latest
    exec-log-apply-report:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - log_apply_report
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'boto3==1.35.99'\
          \ 'requests==2.32.3'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef log_apply_report(\n    mlflow_url: str,\n    mlflow_workspace:\
          \ str,\n    apply_experiment_name: str,\n    batch_id: str,\n    pattern_name:\
          \ str,\n    autorag_run_id: str,\n    minio_endpoint: str,\n    artifact_bucket:\
          \ str,\n    chunks_created: int,\n    documents_indexed: int,\n    embedding_failures:\
          \ int,\n    apply_report: dsl.Input[dsl.Dataset],\n) -> str:\n    \"\"\"\
          logs one mlflow run per apply, under its own phase1-apply-pattern\n    experiment\
          \ rather than mixed into phase1-ingestion, since applying a\n    pattern\
          \ is a separate real world action from ingesting a batch and\n    can happen\
          \ more than once against the same batch as autorag keeps\n    finding better\
          \ recipes.\n    \"\"\"\n    import json\n    import os\n    import time\n\
          \n    import boto3\n    import requests\n\n    with open(apply_report.path)\
          \ as f:\n        report = json.load(f)\n\n    headers = {\"X-MLflow-Workspace\"\
          : mlflow_workspace, \"Content-Type\": \"application/json\"}\n    token_path\
          \ = \"/var/run/secrets/kubernetes.io/serviceaccount/token\"\n    if os.path.exists(token_path):\n\
          \        with open(token_path) as f:\n            headers[\"Authorization\"\
          ] = f\"Bearer {f.read().strip()}\"\n\n    search = requests.post(\n    \
          \    f\"{mlflow_url}/api/2.0/mlflow/experiments/search\",\n        headers=headers,\
          \ json={\"max_results\": 100}, verify=False, timeout=30,\n    ).json()\n\
          \    exp = next((e for e in search.get(\"experiments\", []) if e[\"name\"\
          ] == apply_experiment_name), None)\n    if exp is None:\n        exp = requests.post(\n\
          \            f\"{mlflow_url}/api/2.0/mlflow/experiments/create\",\n    \
          \        headers=headers, json={\"name\": apply_experiment_name}, verify=False,\
          \ timeout=30,\n        ).json()\n        experiment_id = exp[\"experiment_id\"\
          ]\n    else:\n        experiment_id = exp[\"experiment_id\"]\n\n    run_name\
          \ = f\"{batch_id}-{pattern_name}\"\n    run = requests.post(\n        f\"\
          {mlflow_url}/api/2.0/mlflow/runs/create\",\n        headers=headers,\n \
          \       json={\n            \"experiment_id\": experiment_id, \"start_time\"\
          : int(time.time() * 1000),\n            \"tags\": [{\"key\": \"mlflow.runName\"\
          , \"value\": run_name}],\n        },\n        verify=False, timeout=30,\n\
          \    ).json()\n    run_id = run[\"run\"][\"info\"][\"run_id\"]\n    artifact_uri\
          \ = run[\"run\"][\"info\"][\"artifact_uri\"]\n\n    metrics_ts = int(time.time()\
          \ * 1000)\n    requests.post(\n        f\"{mlflow_url}/api/2.0/mlflow/runs/log-batch\"\
          ,\n        headers=headers,\n        json={\n            \"run_id\": run_id,\n\
          \            \"params\": [\n                {\"key\": \"batch_id\", \"value\"\
          : batch_id},\n                {\"key\": \"pattern_name\", \"value\": pattern_name},\n\
          \                {\"key\": \"autorag_run_id\", \"value\": autorag_run_id},\n\
          \            ],\n            \"metrics\": [\n                {\"key\": \"\
          chunks_created\", \"value\": chunks_created, \"timestamp\": metrics_ts},\n\
          \                {\"key\": \"documents_indexed\", \"value\": documents_indexed,\
          \ \"timestamp\": metrics_ts},\n                # a real mlflow metric now,\
          \ not just a field buried in the\n                # json artifact nobody\
          \ downstream was reading, so a non\n                # zero value actually\
          \ shows up in the run view\n                {\"key\": \"embedding_failures\"\
          , \"value\": embedding_failures, \"timestamp\": metrics_ts},\n         \
          \   ],\n        },\n        verify=False, timeout=30,\n    )\n\n    assert\
          \ artifact_uri.startswith(\"s3://\"), artifact_uri\n    _, path = artifact_uri[len(\"\
          s3://\"):].split(\"/\", 1)\n    s3 = boto3.client(\n        \"s3\",\n  \
          \      endpoint_url=f\"http://{minio_endpoint}\",\n        aws_access_key_id=os.environ[\"\
          MINIO_ACCESS_KEY\"],\n        aws_secret_access_key=os.environ[\"MINIO_SECRET_KEY\"\
          ],\n    )\n    s3.put_object(\n        Bucket=artifact_bucket,\n       \
          \ Key=f\"{path}/apply_report.json\",\n        Body=json.dumps(report, indent=2).encode(\"\
          utf-8\"),\n        ContentType=\"application/json\",\n    )\n\n    requests.post(\n\
          \        f\"{mlflow_url}/api/2.0/mlflow/runs/update\",\n        headers=headers,\n\
          \        json={\"run_id\": run_id, \"status\": \"FINISHED\", \"end_time\"\
          : int(time.time() * 1000)},\n        verify=False, timeout=30,\n    )\n\n\
          \    print(f\"logged mlflow run {run_id} in experiment {apply_experiment_name}\"\
          )\n    return run_id\n\n"
        image: registry.access.redhat.com/ubi9/python-311:latest
